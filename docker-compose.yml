version: '3.9'

services:
  # ─── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: event-postgres
    environment:
      POSTGRES_DB: it_event_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: event-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Gateway ─────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: event-api-gateway
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - USER_SERVICE_URL=http://user-service:3001
      - EVENT_SERVICE_URL=http://event-service:3002
      - REGISTRATION_SERVICE_URL=http://registration-service:3003
      - EMAIL_SERVICE_URL=http://email-service:3004
      - CHECKIN_SERVICE_URL=http://checkin-service:3005
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - ANALYTICS_SERVICE_URL=http://analytics-service:3007
      - FILE_SERVICE_URL=http://file-service:3008
      - TASK_SERVICE_URL=http://task-service:3009
      - SUPPORT_SERVICE_URL=http://support-service:3010
      - NETWORKING_SERVICE_URL=http://networking-service:3011
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api-gateway/src:/app/src

  # ─── Microservices ────────────────────────────────────────────────────────────
  user-service:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile
    container_name: event-user-service
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=it_event_platform
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/user-service/src:/app/src

  event-service:
    build:
      context: ./apps/event-service
      dockerfile: Dockerfile
    container_name: event-event-service
    ports:
      - '3002:3002'
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=it_event_platform
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - REDIS_HOST=redis
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/event-service/src:/app/src

  registration-service:
    build:
      context: ./apps/registration-service
      dockerfile: Dockerfile
    container_name: event-registration-service
    ports:
      - '3003:3003'
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=it_event_platform
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/registration-service/src:/app/src

  email-service:
    build:
      context: ./apps/email-service
      dockerfile: Dockerfile
    container_name: event-email-service
    ports:
      - '3004:3004'
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=it_event_platform
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - BREVO_API_KEY=${BREVO_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL}
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/email-service/src:/app/src

  checkin-service:
    build:
      context: ./apps/checkin-service
      dockerfile: Dockerfile
    container_name: event-checkin-service
    ports:
      - '3005:3005'
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=it_event_platform
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/checkin-service/src:/app/src

  notification-service:
    build:
      context: ./apps/notification-service
      dockerfile: Dockerfile
    container_name: event-notification-service
    ports:
      - '3006:3006'
    environment:
      - NODE_ENV=development
      - PORT=3006
      - REDIS_HOST=redis
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/notification-service/src:/app/src

  analytics-service:
    build:
      context: ./apps/analytics-service
      dockerfile: Dockerfile
    container_name: event-analytics-service
    ports:
      - '3007:3007'
    environment:
      - NODE_ENV=development
      - PORT=3007
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=it_event_platform
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/analytics-service/src:/app/src

  file-service:
    build:
      context: ./apps/file-service
      dockerfile: Dockerfile
    container_name: event-file-service
    ports:
      - '3008:3008'
    environment:
      - NODE_ENV=development
      - PORT=3008
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_CLOUDFRONT_URL=${AWS_CLOUDFRONT_URL}
    volumes:
      - ./apps/file-service/src:/app/src

  task-service:
    build:
      context: ./apps/task-service
      dockerfile: Dockerfile
    container_name: event-task-service
    ports:
      - '3009:3009'
    environment:
      - NODE_ENV=development
      - PORT=3009
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=it_event_platform
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/task-service/src:/app/src

  support-service:
    build:
      context: ./apps/support-service
      dockerfile: Dockerfile
    container_name: event-support-service
    ports:
      - '3010:3010'
    environment:
      - NODE_ENV=development
      - PORT=3010
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=it_event_platform
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SUPPORT_CHANNEL=${SLACK_SUPPORT_CHANNEL}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/support-service/src:/app/src

  networking-service:
    build:
      context: ./apps/networking-service
      dockerfile: Dockerfile
    container_name: event-networking-service
    ports:
      - '3011:3011'
    environment:
      - NODE_ENV=development
      - PORT=3011
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=it_event_platform
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/networking-service/src:/app/src

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: event-frontend
    ports:
      - '3100:3100'
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_WS_URL=ws://localhost:3000
    depends_on:
      - api-gateway
    volumes:
      # Eventra (Next.js App Router) keeps source under app/, not src/.
      # NOTE: apps/frontend has no Dockerfile yet — `npm run dev` is the
      # supported way to run the frontend; add a Dockerfile to containerize.
      - ./apps/frontend/app:/app/app

volumes:
  postgres_data:
  redis_data:
